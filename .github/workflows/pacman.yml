name: Update Pac-Man contribution graph

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Normalize output filenames
        run: |
          ls -la dist/
          if [ -f dist/pacman-contribution-graph-light.svg ]; then
            cp dist/pacman-contribution-graph-light.svg dist/pacman-contribution-graph.svg
          fi

      - name: Deploy to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
